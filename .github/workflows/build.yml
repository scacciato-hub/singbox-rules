name: Build sing-box rule-sets

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sing-box 1.14.2
        run: |
          curl -L -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz

          tar -xzf sing-box.tar.gz

      - name: Compile domain rule-set
        run: |
          ./sing-box-1.14.2-linux-amd64/sing-box rule-set compile \
            rules/proxy-domains.json \
            -o proxy-domains.srs

      - name: Compile IP rule-set
        run: |
          ./sing-box-1.14.2-linux-amd64/sing-box rule-set compile \
            rules/proxy-ips.json \
            -o proxy-ips.srs

      - name: Prepare Pages
        run: |
          mkdir public
          cp proxy-domains.srs public/
          cp proxy-ips.srs public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
